<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <header>
        <h1>Adiciona e calcula valores de uma lista dinâmica!</h1>
    </header>
    <section>
        <div id="lista">
            Digite um número de 0 a 100:
            <input type="number" id="nume" min="0" max="100">
            <input type="button" value="Adicionar" id="adicionar" onclick="adicionar()">
            <br>
            <select name="flista" id="flista" size="8">
            </select>
            <br>
            <input type="button" value="Calcular" id="calcular" onclick="finalizar()">  
        </div>

        <div id="res">
        </div>
    </section>

     <script src="script.js"></script>
    
</body>
</html>
