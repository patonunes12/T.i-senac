<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
    <script>
        
        let opcao;

        do {
            opcao = prompt("Exercício 3 - Menu:\n1 - Mostrar Tabuada do 5\n2 - Contagem\n0 - Sair");
            
            if (opcao === null || opcao === "0") {
                console.log("Menu encerrado pelo usuário.");
                break;
            } else if (opcao === "1") {
                console.log("Saída da Tabuada:");
                for (let i = 1; i <= 10; i++) {
                    console.log("5 x " + i + " = " + (5 * i));
                }
            } else if (opcao === "2") {
                console.log("Saída da Contagem:");
                for (let i = 10; i >= 0; i--) {
                    console.log(i);
                }
            } else {
                console.log("Opção inválida digitada no menu: " + opcao);
            }
        } while (opcao !== "0");

        
    </script>
</head>
<body>
    
</body>
</html>
