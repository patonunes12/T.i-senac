<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>par ou impar</title>
</head>
<body>
    <script>
        var num;
        var result;
        num = Number(prompt("Digite um numero"));

        if(num % 2 == 0){
            result="Numero par";

        }else{
            result="Numero impar";
        }

        alert("O numero : " + num + ", é "+result);
        
    </script>
    
</body>
</html>
