<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores lógicos</title>
    <script>

        // E - &&     OU - ||   NEGAÇÃO - !

        //  &&

        console.log("E &&")

        var resultado
        resultado = (true && true);
        console.log(resultado)
        resultado = (true && false);
        console.log(resultado)
        resultado = (false && true);
        console.log(resultado) 
        resultado = (false && false);
        console.log(resultado)


        console.log("OU ||")


        //  ||
        var resultado
        resultado = (true || true);
        console.log(resultado)
        resultado = (true || false);
        console.log(resultado)
        resultado = (false || true);
        console.log(resultado) 
        resultado = (false || false);
        console.log(resultado)
        



















    </script>
</head>
<body>

    <h1>HAHAHA RASPUNTIN</h1>
    
</body>
</html>
