<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch case</title>
    <script>
        var opcao
        opcao = prompt("digite a 34 condição:")
        switch (opcao) {
            case '1':
                alert("Você digitou 1")
                break
            case '2':
                alert("Você digitou 2")
                break
            case '3':
                alert("Você digitou 3")
                break
            case 'Sim':
                alert("Você digitou sim")
                break
            case 'Não':
                alert("Você digitou não")
                break
            default:
                alert("Você digitou outra opção")

        }
    </script>
</head>
<body>
    
</body>
</html>
