<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laços de repetição - FOR</title>
    <script>

        /*for(variável; condição, controle){}
        incremento: i = i+1 ou i += 1 ou i++
        */

        
        for(var i = 1; i <= 5; i = i + 1){
            console.log(i + "- Olá")

        }

        console.log(i)

    </script>
</head>
