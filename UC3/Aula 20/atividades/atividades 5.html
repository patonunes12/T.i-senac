<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    
    var num = Number(prompt("Digite um número de 1 a 10 : "));
   
    var tab = Tabuada(num);

    
    alert(tab);

   
    function Tabuada(num) {
        var text = ""; 
        
        for (var i = 1; i <= 10; i++) {
            var multi = num * i;
            text += num + " x " + i + " = " + multi + "\n";
        }
        
        return text;
}


    </script>
</head>
