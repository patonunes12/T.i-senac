<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 8</title>
    <script>
        
        var num = Number(prompt("Digite um número:")); 
        var ehPar = ePar(num);
        var msg;

        if (ehPar === true) {
            msg = "O número " + num + " é PAR.";
        } else {
            msg = "O número " + num + " é ÍMPAR.";
        }

        function ePar(n) {
            var res = (n % 2 === 0);
            return res; 
        }
        
        alert(msg);
           
    </script>
</head>

</body>
</html>
