    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 5</title>
    <script>
        var base = Number(prompt("Digite o tamanho da base"))
        var altura = Number(prompt("Digite o tamanho da altura"))

        alert("A área foi " + Area(base, altura) + "cm²")

        function Area (base, altura){
            var calculoArea = base * altura;

            return calculoArea

        }

    </script>
