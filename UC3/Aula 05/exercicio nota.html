<body>

    <h1>Exercicio aula 5</h1>

    <script>
        var nota1 = prompt("Digite sua primeira nota")
        var nota2 = prompt("Digite sua segunda nota")
        var total

        total = (Number(nota1) + Number(nota2))/3

        if(total >= 7){
            console.log("Sua nota foi "+total+" é você passou de ano")
        }else{
            console.log("Sua nota foi "+total+" é você foi reprovado")
        }

        console.log("Fim")




    </script>
